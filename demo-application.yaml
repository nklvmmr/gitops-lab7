apiVersion argoproj.iov1alpha1
kind Application
metadata
  name demo-app
  namespace argocd
spec
  project default
  source
    repoURL httpsgithub.comnklvmmrgitops-lab7.git
    targetRevision main
    path demo-infra
  destination
    server httpskubernetes.default.svc
    namespace demo
  syncPolicy
    automated
      prune true
      selfHeal true